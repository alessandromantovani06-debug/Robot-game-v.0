<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04060c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Rift Titans: costruisci e personalizza il tuo robot gigante e combatti i Kaiju che emergono dalla Frattura."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <title>Rift Titans</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060c;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #3fd2ff;
        font: 600 14px/1.2 system-ui, sans-serif;
        letter-spacing: 0.3em;
        z-index: 100;
        background: radial-gradient(circle at 50% 60%, #0b1a2e, #04060c 70%);
        transition: opacity 0.6s;
      }
      #boot .bar {
        width: 180px;
        height: 3px;
        background: #0e2236;
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #3fd2ff;
        animation: boot 1s infinite ease-in-out;
      }
      @keyframes boot {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="rotate">
      <div class="rotate-icon"></div>
      <p>Ruota il dispositivo in orizzontale</p>
    </div>
    <div id="boot">
      <div>RIFT TITANS</div>
      <div class="bar"></div>
      <noscript>Per giocare abilita JavaScript.</noscript>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
